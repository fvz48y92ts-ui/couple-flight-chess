<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>情侣飞行棋 V2.0</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
  "Helvetica Neue",Arial,sans-serif;
  background:#f5f5f7;
  color:#1c1c1e;
  min-height:100vh;
}

button{
  border:0;
  font:inherit;
  cursor:pointer;
}

.app{
  width:min(720px,100%);
  margin:auto;
  padding:18px 14px 40px;
}

.header{
  text-align:center;
  padding:10px 0 16px;
}

.header h1{
  margin:0;
  font-size:28px;
  letter-spacing:-1px;
}

.header p{
  margin:6px 0 0;
  color:#8e8e93;
  font-size:13px;
}

.card{
  background:rgba(255,255,255,.88);
  border:1px solid rgba(0,0,0,.06);
  border-radius:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  padding:16px;
  margin-bottom:14px;
  backdrop-filter:blur(20px);
}

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.player{
  border-radius:18px;
  padding:12px;
  background:#f2f2f7;
  text-align:center;
  transition:.25s;
}

.player.active{
  background:#e8f1ff;
  box-shadow:0 0 0 2px #007aff inset;
}

.player-dot{
  width:22px;
  height:22px;
  border-radius:50%;
  display:inline-block;
  vertical-align:middle;
  margin-right:6px;
}

.board-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  margin:auto;
  background:
    linear-gradient(135deg,#eef7ff,#fff1f7);
  border-radius:28px;
  padding:10px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 15px 35px rgba(0,0,0,.1);
}

.board{
  width:100%;
  height:100%;
  position:relative;
  border-radius:22px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#fff 0%,#f7f7fa 55%,#ededf2 100%);
}

.board::before{
  content:"💕";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:45px;
  opacity:.22;
}

.cell{
  position:absolute;
  width:8%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#fff;
  border:2px solid #d1d1d6;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:700;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
}

.cell.task{
  background:#fff2c7;
  border-color:#ffcc00;
}

.cell.lucky{
  background:#e8f8ec;
  border-color:#34c759;
}

.cell.start{
  background:#e5f0ff;
  border-color:#007aff;
}

.cell.end{
  background:#ffe5ed;
  border-color:#ff375f;
}

.token{
  position:absolute;
  width:31px;
  height:31px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  border:3px solid white;
  box-shadow:
    0 4px 10px rgba(0,0,0,.25),
    0 0 0 1px rgba(0,0,0,.1);
  transition:
    left .3s ease,
    top .3s ease;
}

.token.boy{
  background:#007aff;
}

.token.girl{
  background:#ff375f;
}

.dice-area{
  text-align:center;
}

.dice{
  width:100px;
  height:100px;
  margin:4px auto 12px;
  border-radius:24px;
  background:linear-gradient(145deg,#fff,#e5e5ea);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:62px;
  box-shadow:
    0 10px 25px rgba(0,0,0,.15),
    inset 0 1px 1px white;
}

.dice.rolling{
  animation:dice .65s ease;
}

@keyframes dice{
  0%{transform:rotate(0) scale(1)}
  25%{transform:rotate(15deg) scale(1.08)}
  50%{transform:rotate(-18deg) scale(1.08)}
  75%{transform:rotate(10deg) scale(1.04)}
  100%{transform:rotate(0) scale(1)}
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.primary{
  background:#007aff;
  color:#fff;
}

.secondary{
  background:#e5e5ea;
  color:#1c1c1e;
}

.danger{
  background:#ff3b30;
  color:#fff;
}

.success{
  background:#34c759;
  color:#fff;
}

button{
  min-height:46px;
  border-radius:14px;
  padding:0 14px;
  font-weight:700;
}

button:active{
  transform:scale(.97);
}

.status{
  text-align:center;
  padding:12px;
  background:#f2f2f7;
  border-radius:14px;
  margin-top:10px;
  font-size:14px;
}

.task-box{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:15px;
  background:#fff8e1;
  border-radius:17px;
  font-size:16px;
  font-weight:650;
}

.log{
  max-height:180px;
  overflow:auto;
  font-size:13px;
}

.log div{
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.input{
  width:100%;
  padding:12px;
  border-radius:13px;
  border:1px solid #d1d1d6;
  font-size:16px;
  outline:none;
  background:#fff;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.38);
  backdrop-filter:blur(12px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(430px,100%);
  background:rgba(255,255,255,.97);
  border-radius:28px;
  padding:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
  animation:pop .22s ease;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.modal h2{
  margin:0 0 10px;
  font-size:24px;
}

.modal p{
  line-height:1.6;
  color:#3a3a3c;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.modal-buttons.one{
  grid-template-columns:1fr;
}

.setup{
  position:fixed;
  inset:0;
  background:rgba(245,245,247,.98);
  backdrop-filter:blur(20px);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.setup.hidden{
  display:none;
}

.setup-card{
  width:min(450px,100%);
  background:white;
  border-radius:30px;
  padding:24px;
  box-shadow:0 25px 80px rgba(0,0,0,.16);
}

.setup-card h1{
  margin:0;
  font-size:28px;
}

.setup-card p{
  color:#8e8e93;
  font-size:13px;
  line-height:1.5;
}

.field{
  margin:15px 0;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#636366;
}

.colors{
  display:flex;
  gap:12px;
}

.color{
  width:40px;
  height:40px;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 0 0 1px #ccc;
}

.color.selected{
  box-shadow:0 0 0 3px #1c1c1e;
}

.blue{background:#007aff}
.red{background:#ff375f}
.purple{background:#af52de}
.orange{background:#ff9500}
.green{background:#34c759}

.hidden{
  display:none!important;
}

@media(max-width:480px){
  .app{
    padding:10px 10px 30px;
  }

  .header h1{
    font-size:24px;
  }

  .dice{
    width:85px;
    height:85px;
    font-size:53px;
  }

  .token{
    width:27px;
    height:27px;
  }
}
</style>
</head>

<body>

<div id="setup" class="setup">
  <div class="setup-card">
    <h1>💕 情侣飞行棋</h1>
    <p>
      V2.0<br>
      在传统飞行棋基础上加入任务、幸运、相遇攻击和特殊效果。
    </p>

    <div class="field">
      <label>玩家 1 名称</label>
      <input id="name1" class="input" value="玩家 1">
    </div>

    <div class="field">
      <label>玩家 1 棋子颜色</label>
      <div class="colors">
        <button class="color blue selected" data-player="1" data-color="#007aff"></button>
        <button class="color purple" data-player="1" data-color="#af52de"></button>
        <button class="color orange" data-player="1" data-color="#ff9500"></button>
      </div>
    </div>

    <div class="field">
      <label>玩家 2 名称</label>
      <input id="name2" class="input" value="玩家 2">
    </div>

    <div class="field">
      <label>玩家 2 棋子颜色</label>
      <div class="colors">
        <button class="color red selected" data-player="2" data-color="#ff375f"></button>
        <button class="color green" data-player="2" data-color="#34c759"></button>
        <button class="color purple" data-player="2" data-color="#af52de"></button>
      </div>
    </div>

    <button id="startBtn" class="primary" style="width:100%">
      开始游戏
    </button>
  </div>
</div>


<div id="eventOverlay" class="overlay">
  <div class="modal">
    <h2 id="eventTitle">事件</h2>
    <p id="eventText"></p>
    <div id="eventButtons" class="modal-buttons one"></div>
  </div>
</div>


<div class="app">

  <div class="header">
    <h1>💕 情侣飞行棋</h1>
    <p>V2.0 · 一部手机，两个人一起玩</p>
  </div>


  <div class="card">
    <div class="players">

      <div id="player1Card" class="player active">
        <span id="dot1" class="player-dot" style="background:#007aff"></span>
        <strong id="displayName1">玩家 1</strong>
        <div style="font-size:12px;color:#8e8e93;margin-top:5px">
          第 <span id="pos1">0</span> 格
        </div>
      </div>

      <div id="player2Card" class="player">
        <span id="dot2" class="player-dot" style="background:#ff375f"></span>
        <strong id="displayName2">玩家 2</strong>
        <div style="font-size:12px;color:#8e8e93;margin-top:5px">
          第 <span id="pos2">0</span> 格
        </div>
      </div>

    </div>

    <div id="status" class="status">
      玩家 1 的回合
    </div>
  </div>


  <div class="card">

    <div class="board-wrap">
      <div id="board" class="board">

        <div id="token1" class="token boy"></div>
        <div id="token2" class="token girl"></div>

      </div>
    </div>

  </div>


  <div class="card dice-area">

    <h3>🎲 掷骰子</h3>

    <div id="dice" class="dice">
      ⚄
    </div>

    <div class="actions">

      <button id="rollBtn" class="primary">
        🎲 掷骰子
      </button>

      <button id="specialBtn" class="secondary">
        ✨ 特殊效果
      </button>

    </div>

  </div>


  <div class="card">

    <h3>🎯 当前任务</h3>

    <div id="taskBox" class="task-box">
      等待进入任务格……
    </div>

  </div>


  <div class="card">

    <h3>📜 游戏记录</h3>

    <div id="log" class="log">
      <div>游戏还没有开始。</div>
    </div>

  </div>


  <div class="card">

    <h3>⚙️ 游戏设置</h3>

    <div class="settings">

      <button id="saveBtn" class="secondary">
        💾 保存
      </button>

      <button id="restartBtn" class="danger">
        🔄 重新开始
      </button>

    </div>

  </div>

</div>


<script>

const MAX_POS = 30;

const TASKS = [

  "认真说出对方三个优点。",
  "说出你们最近一次开心的回忆。",
  "用三个词形容自己。",
  "给对方一句真诚的鼓励。",
  "说一个你最喜欢对方的小习惯。",
  "快速说出三件你们一起做过的事情。",
  "说一个你们以后想一起完成的计划。",
  "用一句话描述你理想中的约会。",
  "模仿对方说一句口头禅。",
  "说出一个你平时不太好意思说的话。",
  "回答对方临时提出的一个问题。",
  "做一个搞笑表情并保持三秒。",
  "说出你第一次注意到对方时的一个细节。",
  "说一句你觉得最适合对方的话。",
  "说一个你希望两个人以后一起尝试的事情。",
  "快速说出对方的三个喜好。",
  "讲一个最近发生的小趣事。",
  "用一句话描述你眼中的对方。",
  "说出一个你们共同喜欢的东西。",
  "闭眼三秒，然后说出对方现在可能在想什么。"

];


const DICE = [
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];


const game = {

  started:false,

  over:false,

  current:1,

  players:{
    1:{
      name:"玩家 1",
      pos:0,
      color:"#007aff"
    },

    2:{
      name:"玩家 2",
      pos:0,
      color:"#ff375f"
    }
  },

  taskCells:[],
  luckyCells:[],

  extraRoll:false,

  forcedAttack:false

};


const $ = id => document.getElementById(id);


function random(min,max){

  return Math.floor(
    Math.random()*(max-min+1)
  )+min;

}


function shuffle(array){

  return array
    .map(v=>({v,sort:Math.random()}))
    .sort((a,b)=>a.sort-b.sort)
    .map(x=>x.v);

}


function addLog(text){

  const log = $("log");

  const item = document.createElement("div");

  item.textContent = text;

  log.prepend(item);

}


function status(text){

  $("status").textContent = text;

}


function updatePlayers(){

  $("displayName1").textContent =
    game.players[1].name;

  $("displayName2").textContent =
    game.players[2].name;

  $("pos1").textContent =
    game.players[1].pos;

  $("pos2").textContent =
    game.players[2].pos;

  $("dot1").style.background =
    game.players[1].color;

  $("dot2").style.background =
    game.players[2].color;

  $("player1Card").classList.toggle(
    "active",
    game.current===1
  );

  $("player2Card").classList.toggle(
    "active",
    game.current===2
  );

  $("token1").style.background =
    game.players[1].color;

  $("token2").style.background =
    game.players[2].color;

}


function createBoard(){

  const board = $("board");

  board.querySelectorAll(".cell").forEach(
    x=>x.remove()
  );


  const cells = [];


  for(let i=0;i<=MAX_POS;i++){

    let x;
    let y;


    if(i<=10){

      x = 8 + i*8.4;
      y = 88;

    }

    else if(i<=20){

      x = 92;
      y = 88-(i-10)*7.5;

    }

    else{

      x = 92-(i-20)*8.4;
      y = 13;

    }


    cells.push({x,y});


    const cell =
      document.createElement("div");

    cell.className = "cell";

    if(i===0){

      cell.classList.add("start");
      cell.textContent = "起点";

    }
    else if(i===MAX_POS){

      cell.classList.add("end");
      cell.textContent = "🏆";

    }
    else{

      cell.textContent = i;

    }


    cell.style.left = x+"%";
    cell.style.top = y+"%";

    cell.dataset.pos = i;

    board.appendChild(cell);

  }


  game.boardCells = cells;

  markSpecialCells();

  updateTokens();

}


function markSpecialCells(){

  document
    .querySelectorAll(".cell")
    .forEach(cell=>{

      const p =
        Number(cell.dataset.pos);

      cell.classList.remove(
        "task",
        "lucky"
      );


      if(game.taskCells.includes(p)){

        cell.classList.add("task");

        cell.textContent = "🎯";

      }

      else if(game.luckyCells.includes(p)){

        cell.classList.add("lucky");

        cell.textContent = "🍀";

      }

    });

}


function updateTokens(){

  if(!game.boardCells) return;


  [1,2].forEach(player=>{

    const pos =
      game.players[player].pos;

    const point =
      game.boardCells[
        Math.min(pos,MAX_POS)
      ];


    const token =
      $("token"+player);


    token.style.left =
      point.x+"%";

    token.style.top =
      point.y+"%";

  });


  updatePlayers();

}


function generateSpecialCells(){

  const available=[];


  for(
    let i=2;
    i<MAX_POS;
    i++
  ){

    available.push(i);

  }


  const shuffled =
    shuffle(available);


  const taskCount =
    random(4,8);


  game.taskCells =
    shuffled.slice(
      0,
      taskCount
    );


  game.luckyCells =
    shuffled.slice(
      taskCount,
      taskCount+5
    );


  markSpecialCells();

}


function showSetup(){

  $("setup")
    .classList
    .remove("hidden");

}


function hideSetup(){

  $("setup")
    .classList
    .add("hidden");

}


document
  .querySelectorAll(".color")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        const player =
          button.dataset.player;

        const color =
          button.dataset.color;


        document
          .querySelectorAll(
            `.color[data-player="${player}"]`
          )
          .forEach(
            b=>b.classList.remove("selected")
          );


        button.classList.add("selected");

        game.players[player].color =
          color;

      }
    );

  });


$("startBtn").addEventListener(
  "click",
  startGame
);


function startGame(){

  game.players[1].name =
    $("name1").value.trim() ||
    "玩家 1";

  game.players[2].name =
    $("name2").value.trim() ||
    "玩家 2";


  game.players[1].pos=0;
  game.players[2].pos=0;

  game.current=1;

  game.over=false;

  game.extraRoll=false;

  game.forcedAttack=false;

  game.started=true;


  generateSpecialCells();

  createBoard();

  updateTokens();

  $("taskBox").textContent =
    "等待进入任务格……";


  $("log").innerHTML =
    "<div>🎮 新游戏开始。</div>";


  addLog(
    `${game.players[1].name}先开始。`
  );


  hideSetup();

  status(
    `${game.players[1].name} 的回合`
  );


  saveGame();

}


function showModal(
  title,
  text,
  buttons
){

  $("eventTitle").textContent =
    title;

  $("eventText").textContent =
    text;


  const box =
    $("eventButtons");

  box.innerHTML="";


  buttons.forEach(button=>{

    const b =
      document.createElement("button");

    b.textContent =
      button.text;

    b.className =
      button.className ||
      "secondary";


    b.addEventListener(
      "click",
      ()=>{

        closeModal();

        button.action();

      }
    );


    box.appendChild(b);

  });


  $("eventOverlay")
    .classList
    .add("show");

}


function closeModal(){

  $("eventOverlay")
    .classList
    .remove("show");

}


function rollDice(){

  if(!game.started) return;

  if(game.over) return;


  const player =
    game.current;


  const dice =
    $("dice");


  const roll =
    random(1,6);


  dice.classList.remove(
    "rolling"
  );


  void dice.offsetWidth;


  dice.classList.add(
    "rolling"
  );


  dice.textContent =
    DICE[roll-1];


  status(
    `${game.players[player].name} 掷出了 ${roll}`
  );


  addLog(
    `${game.players[player].name} 掷出了 ${roll} 点。`
  );


  setTimeout(
    ()=>movePlayer(
      player,
      roll
    ),
    650
  );

}


function movePlayer(
  player,
  steps
){

  if(game.over) return;


  const p =
    game.players[player];


  const start =
    p.pos;


  const target =
    Math.min(
      MAX_POS,
      start+steps
    );


  let current =
    start;


  const timer =
    setInterval(()=>{

      current++;

      p.pos =
        current;

      updateTokens();


      if(current>=target){

        clearInterval(timer);

        finishMovement(player);

      }

    },220);

}


function finishMovement(player){

  const p =
    game.players[player];


  if(p.pos>=MAX_POS){

    win(player);

    return;

  }


  const other =
    player===1 ? 2 : 1;


  if(
    game.players[other].pos===
    p.pos
  ){

    encounter(
      player,
      other
    );

    return;

  }


  if(
    game.taskCells.includes(
      p.pos
    )
  ){

    taskEvent(player);

    return;

  }


  if(
    game.luckyCells.includes(
      p.pos
    )
  ){

    luckyEvent(player);

    return;

  }


  nextTurn();

}


function taskEvent(player){

  const task =
    TASKS[
      random(
        0,
        TASKS.length-1
      )
    ];


  $("taskBox").textContent =
    task;


  showModal(
    "🎯 当前任务",
    task,
    [

      {
        text:"✅ 完成任务",
        className:"success",
        action:()=>{

          addLog(
            `${game.players[player].name} 完成了任务。`
          );


          showModal(
            "✨ 任务完成",
            "不错！继续前进。",
            [
              {
                text:"继续",
                className:"success",
                action:nextTurn
              }
            ]
          );

        }
      },


      {
        text:"❌ 我失败了",
        className:"danger",
        action:()=>{

          const penalty =
            random(1,3);


          game.players[player].pos =
            Math.max(
              0,
              game.players[player].pos-
              penalty
            );


          updateTokens();


          addLog(
            `${game.players[player].name} 任务失败，后退 ${penalty} 格。`
          );


          showModal(
            "⚠️ 任务失败",
            `随机惩罚：后退 ${penalty} 格。`,
            [
              {
                text:"接受惩罚",
                className:"danger",
                action:()=>{

                  if(
                    game.taskCells.includes(
                      game.players[player].pos
                    )
                  ){

                    $("taskBox").textContent =
                      "你后退到了任务格。";

                  }


                  nextTurn();

                }
              }
            ]
          );

        }
      }

    ]

  );

}


function luckyEvent(player){

  const good =
    Math.random()<0.62;


  if(good){

    const type =
      random(1,4);


    let text="";


    if(type===1){

      text="前进 2 格";

    }

    if(type===2){

      text="获得一次额外掷骰";

    }

    if(type===3){

      text="下一次任务自动完成";

    }

    if(type===4){

      text="获得一次攻击强化";

    }


    addLog(
      `${game.players[player].name} 触发幸运：${text}`
    );


    showModal(
      "🍀 幸运事件",
      text,
      [
        {
          text:"太棒了",
          className:"success",
          action:()=>{

            if(type===1){

              game.players[player].pos =
                Math.min(
                  MAX_POS,
                  game.players[player].pos+2
                );

              updateTokens();

            }


            if(type===2){

              game.extraRoll=true;

            }


            nextTurn();

          }
        }
      ]
    );

  }
  else{

    const type =
      random(1,3);


    let text="";


    if(type===1){

      text="后退 1 格";

    }

    if(type===2){

      text="下一回合不能主动攻击";

    }

    if(type===3){

      text="下一次任务不能选择失败";

    }


    addLog(
      `${game.players[player].name} 触发意外：${text}`
    );


    showModal(
      "⚠️ 意外效果",
      text,
      [
        {
          text:"知道了",
          className:"danger",
          action:()=>{

            if(type===1){

              game.players[player].pos =
                Math.max(
                  0,
                  game.players[player].pos-1
                );

              updateTokens();

            }


            nextTurn();

          }
        }
      ]
    );

  }

}


function encounter(
  player,
  other
){

  const name =
    game.players[player].name;

  const otherName =
    game.players[other].name;


  showModal(
    "⚔️ 相遇！",
    `${name} 遇到了 ${otherName}。`,
    [

      {
        text:"⚔️ 发动攻击",
        className:"danger",
        action:()=>attack(
          player,
          other
        )
      },


      {
        text:"🎲 随机特殊效果",
        className:"success",
        action:()=>specialEffect(
          player,
          other
        )
      },


      {
        text:"🕊️ 不攻击",
        className:"secondary",
        action:()=>{

          addLog(
            `${name} 选择不攻击。`
          );


          nextTurn();

        }
      }

    ]

  );

}


function attack(
  player,
  other
){

  const success =
    Math.random()<0.68;


  if(success){

    const effect =
      random(1,4);


    let text="";


    if(effect===1){

      const n=random(2,3);

      game.players[other].pos =
        Math.max(
          0,
          game.players[other].pos-n
        );

      text =
        `${game.players[other].name} 后退 ${n} 格。`;

    }


    if(effect===2){

      game.players[other].pos =
        Math.max(
          0,
          game.players[other].pos-2
        );

      text =
        `${game.players[other].name} 后退 2 格。`;

    }


    if(effect===3){

      game.extraRoll=true;

      text =
        `${game.players[player].name} 获得一次额外掷骰。`;

    }


    if(effect===4){

      text =
        `${game.players[player].name} 下一次任务自动完成。`;

    }


    updateTokens();


    addLog(
      `${game.players[player].name} 攻击成功：${text}`
    );


    showModal(
      "⚔️ 攻击成功",
      text,
      [
        {
          text:"确定",
          className:"success",
          action:()=>{

            if(
              game.players[other].pos>=
              MAX_POS
            ){

              win(other);

            }
            else{

              nextTurn();

            }

          }
        }
      ]
    );

  }
  else{

    const penalty =
      random(2,3);


    game.players[player].pos =
      Math.max(
        0,
        game.players[player].pos-
        penalty
      );


    updateTokens();


    addLog(
      `${game.players[player].name} 攻击失败！${game.players[other].name} 反击，后退 ${penalty} 格。`
    );


    showModal(
      "💥 攻击失败",
      `${game.players[other].name} 反击！你后退 ${penalty} 格。`,
      [
        {
          text:"承受反击",
          className:"danger",
          action:()=>nextTurn()
        }
      ]
    );

  }

}


function specialEffect(
  player,
  other
){

  const type =
    random(1,5);


  let text="";


  if(type===1){

    game.players[player].pos =
      Math.min(
        MAX_POS,
        game.players[player].pos+2
      );

    text="你前进 2 格。";

  }


  if(type===2){

    game.players[other].pos =
      Math.max(
        0,
        game.players[other].pos-2
      );

    text =
      `${game.players[other].name} 后退 2 格。`;

  }


  if(type===3){

    game.extraRoll=true;

    text =
      "获得一次额外掷骰机会。";

  }


  if(type===4){

    text =
      "下一次任务自动完成。";

  }


  if(type===5){

    game.players[player].pos =
      Math.max(
        0,
        game.players[player].pos-1
      );

    text =
      "运气不好，你后退 1 格。";

  }


  updateTokens();


  addLog(
    `${game.players[player].name} 触发特殊效果：${text}`
  );


  showModal(
    "🎲 随机特殊效果",
    text,
    [
      {
        text:"确定",
        className:"success",
        action:()=>nextTurn()
      }
    ]
  );

}


function nextTurn(){

  if(game.over) return;


  if(game.extraRoll){

    game.extraRoll=false;

    status(
      `${game.players[game.current].name} 获得额外一次掷骰`
    );

    saveGame();

    return;

  }


  game.current =
    game.current===1 ? 2 : 1;


  status(
    `${game.players[game.current].name} 的回合`
  );


  updatePlayers();

  saveGame();

}


function win(player){

  game.over=true;


  addLog(
    `🏆 ${game.players[player].name} 到达终点，获得胜利！`
  );


  status(
    `${game.players[player].name} 获胜！`
  );


  showModal(
    "🏆 恭喜获胜",
    `${game.players[player].name} 率先到达终点！`,
    [

      {
        text:"🔄 再来一局",
        className:"success",
        action:restartGame
      }

    ]
  );

}


function saveGame(){

  if(!game.started) return;


  try{

    localStorage.setItem(
      "couple_flight_chess_v2",
      JSON.stringify(game)
    );

  }
  catch(e){}

}


function loadGame(){

  try{

    const raw =
      localStorage.getItem(
        "couple_flight_chess_v2"
      );


    if(!raw) return false;


    const saved =
      JSON.parse(raw);


    if(!saved.started) return false;


    Object.assign(
      game,
      saved
    );


    createBoard();

    updateTokens();

    return true;

  }
  catch(e){

    return false;

  }

}


function restartGame(){

  localStorage.removeItem(
    "couple_flight_chess_v2"
  );


  game.started=false;

  game.over=false;

  game.current=1;

  game.players[1].pos=0;

  game.players[2].pos=0;

  showSetup();

}


$("rollBtn").addEventListener(
  "click",
  rollDice
);


$("specialBtn").addEventListener(
  "click",
  ()=>{

    if(!game.started||game.over)
      return;


    specialEffect(
      game.current,
      game.current===1?2:1
    );

  }
);


$("saveBtn").addEventListener(
  "click",
  ()=>{

    saveGame();

    status("✅ 游戏进度已保存");

  }
);


$("restartBtn").addEventListener(
  "click",
  ()=>{

    showModal(
      "🔄 重新开始",
      "确定要结束当前游戏并重新开始吗？",
      [

        {
          text:"确定重新开始",
          className:"danger",
          action:restartGame
        },

        {
          text:"取消",
          className:"secondary",
          action:()=>{}
        }

      ]
    );

  }
);


createBoard();


if(!loadGame()){

  showSetup();

}
else{

  $("setup")
    .classList
    .add("hidden");

}

</script>

</body>
</html>
