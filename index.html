<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>情侣飞行棋 Pro</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#8e8e93;--primary:#007aff;--radius:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans SC",sans-serif;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;user-select:none}
#app{height:100%;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);overflow-y:auto;padding:calc(14px + var(--st)) 14px calc(14px + var(--sb))}
.page.active{display:flex}
.pc{max-width:420px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.btn{border:none;border-radius:13px;font-size:16px;font-weight:600;padding:12px 16px;cursor:pointer;font-family:var(--font)}
.btn:active{opacity:.85}
.btn-p{background:var(--primary);color:#fff}
.btn-s{background:#e5e5ea;color:var(--text)}
.btn-l{width:100%;padding:14px;font-size:17px}
.btn:disabled{opacity:.4}
.logo{text-align:center;font-size:24px;font-weight:700}
.logo span{color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.pt{text-align:center;font-size:19px;font-weight:700}
.ps{display:flex;align-items:center;gap:8px}
.pcard{flex:1;background:var(--card);border-radius:var(--radius);padding:12px 8px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.av{width:48px;height:48px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.ni{width:100%;border:none;background:#f2f2f7;border-radius:9px;padding:7px;font-size:13px;text-align:center;font-family:var(--font);margin-bottom:6px}
.cp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.cd{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cd.active{border-color:#1c1c1e;transform:scale(1.1)}
.vs{font-weight:700;color:var(--text2)}
.or{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.seg{display:flex;background:#e5e5ea;border-radius:9px;padding:2px;flex-wrap:wrap;gap:2px}
.seg button{border:none;background:transparent;padding:5px 9px;border-radius:7px;font-size:12px;font-weight:500;font-family:var(--font);cursor:pointer}
.seg button.active{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stitle{font-size:12px;color:var(--text2);margin-bottom:4px}
#page-game{padding:0}
.gh{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--st)) 12px 8px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,.05)}
.ti{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.td{width:9px;height:9px;border-radius:50%;background:#ccc}
.bw{flex:1;display:flex;align-items:center;justify-content:center;padding:4px}
.board{position:relative;width:min(92vw,340px);height:min(92vw,340px);background:var(--card);border-radius:50%;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.cell{position:absolute;width:22px;height:22px;border-radius:50%;background:#e8e8ed;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:var(--text2);transform:translate(-50%,-50%)}
.cell.fly{background:#ffd60a;color:#1c1c1e}
.cell.rest{background:#bf5af2;color:#fff}
.piece{position:absolute;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;transform:translate(-50%,-50%);z-index:5;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:left .35s,top .35s}
.finish{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ff3b30,#ff9500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;z-index:3}
.gf{background:rgba(255,255,255,.92);padding:6px 12px calc(6px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:5px;border-top:1px solid rgba(0,0,0,.05)}
.sb{display:flex;gap:4px;min-height:26px;flex-wrap:wrap;justify-content:center}
.sc{background:linear-gradient(135deg,#5856d6,#007aff);color:#fff;font-size:10px;padding:3px 8px;border-radius:12px;cursor:pointer}
.db{width:64px;height:64px;border-radius:15px;border:none;background:var(--card);box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dice{width:44px;height:44px;background:#1c1c1e;border-radius:9px;color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.dice.rolling{animation:dr .11s infinite}
@keyframes dr{0%{transform:rotate(0)}50%{transform:rotate(12deg) scale(1.08)}100%{transform:rotate(-12deg)}}
.dh{font-size:11px;color:var(--text2)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.mo.ctr{align-items:center}
.modal{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:420px;padding:18px 14px calc(16px + var(--sb));max-height:85vh;overflow-y:auto}
.mo.ctr .modal{border-radius:16px;margin:12px}
.mt{font-size:17px;font-weight:700;text-align:center;margin-bottom:8px}
.mb{margin-bottom:14px;line-height:1.45;font-size:14.5px;text-align:center}
.ma{display:flex;flex-direction:column;gap:7px}
#toast{position:fixed;top:15%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:7px 14px;border-radius:14px;font-size:12.5px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<section id="page-rules" class="page active">
<div class="pc">
<h1 class="logo">情侣飞行棋 <span>Pro</span></h1>
<div class="card">
<ol style="padding-left:18px;font-size:13.5px;line-height:1.55">
<li>双人轮流，共用一台手机</li>
<li>必须摇到6才能出发</li>
<li>必须点数正好到达终点，超过则回退</li>
<li>休息格会跳过自己下一回合</li>
<li>支持1~3个棋子，全部到达才算赢</li>
</ol>
</div>
<button class="btn btn-p btn-l" id="btnRules">开始</button>
</div>
</section>

<section id="page-setup" class="page">
<div class="pc">
<h1 class="pt">游戏设置</h1>
<div class="ps">
<div class="pcard"><div class="av" id="av0">小</div><input class="ni" id="n0" value="小锐" maxlength="6"><div class="cp" id="c0"></div></div>
<div class="vs">VS</div>
<div class="pcard"><div class="av" id="av1">可</div><input class="ni" id="n1" value="小可爱" maxlength="6"><div class="cp" id="c1"></div></div>
</div>
<div class="card"><div class="stitle">每人棋子数量</div>
<div class="seg" id="pNum">
<button data-v="1" class="active">1个</button>
<button data-v="2">2个</button>
<button data-v="3">3个</button>
</div></div>
<div class="card"><div class="stitle">格子数量</div>
<div class="seg" id="gNum">
<button data-v="24">24格</button>
<button data-v="36" class="active">36格</button>
<button data-v="48">48格</button>
</div></div>
<div class="card"><div class="stitle">氛围</div>
<div class="seg" id="mood">
<button data-v="sweet">甜</button>
<button data-v="mix" class="active">混合</button>
<button data-v="desire">欲</button>
<button data-v="wild">疯</button>
</div></div>
<div class="card">
<div class="or"><span style="font-size:13px">不喝酒</span>
<div class="seg" id="nd"><button data-v="0" class="active">关</button><button data-v="1">开</button></div></div>
</div>
<button class="btn btn-p btn-l" id="btnStart">进入游戏</button>
</div>
</section>

<section id="page-game" class="page">
<header class="gh">
<div class="ti"><span class="td" id="td"></span><span id="tt">准备中</span></div>
<button style="background:none;border:none;font-size:20px" id="btnSet">⚙️</button>
</header>
<div class="bw"><div class="board" id="board"><div class="finish">终点</div></div></div>
<div class="gf">
<div class="sb" id="sbar"></div>
<button class="db" id="dbtn"><div class="dice" id="dice">?</div></button>
<p class="dh" id="dhint">点击掷骰子</p>
</div>
</section>
</div>
<div id="toast"></div>
<div id="mroot"></div>

<script>
const COLORS=["#007aff","#ff2d55","#5856d6","#ff9500","#34c759","#af52de","#ff3b30","#00c7be"];
const POOL={
sweet:[{text:"对视30秒",time:30},{text:"说一句肉麻的话"},{text:"描述对方最吸引你的细节"},{text:"闭眼听呼吸20秒",time:20},{text:"说一件甜的小事"},{text:"夸对方三个优点"},{text:"额头吻"},{text:"十指相扣30秒",time:30}],
desire:[{text:"为对方脱一件衣服"},{text:"亲吻嘴唇15秒",time:15},{text:"舌吻30秒",time:30},{text:"抚摸20秒",time:20},{text:"自己脱一件"},{text:"背后拥抱爱抚1分钟",time:60},{text:"深情舌吻40秒",time:40},{text:"用手服务1分钟",time:60,type:"fly"}],
wild:[{text:"后入1分钟",time:60,type:"fly"},{text:"坐脸30秒",time:30},{text:"观音坐莲1分钟",time:60},{text:"挑逗30秒",time:30},{text:"说一句色色的话"},{text:"自己打屁股3下"}],
drink:[{text:"喝半杯"},{text:"喝一杯"}],
rest:[{text:"下一轮休息",type:"rest"}],
special:[{text:"后退2格"},{text:"后退3格"}]
};
const SKILLS=[{id:"acc",name:"加速"},{id:"int",name:"干扰"},{id:"shd",name:"免死"},{id:"rer",name:"重掷"},{id:"swp",name:"互换"}];

const S={
  players:[
    {name:"小锐",color:COLORS[0],pieces:[],skipTurn:false,skills:[],stats:{steps:0}},
    {name:"小可爱",color:COLORS[1],pieces:[],skipTurn:false,skills:[],stats:{steps:0}}
  ],
  cur:0, n:36, pieceCount:1, mood:"mix", noDrink:false,
  started:false, over:false, lastRoll:0, tasks:[]
};

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function toast(m){const t=$("#toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity=0,1800)}

function show(p){$$(".page").forEach(x=>x.classList.remove("active"));$("#page-"+p).classList.add("active")}

function makePool(){
  let arr=[];
  const add=(src,c)=>{for(let i=0;i<c;i++)arr.push(Object.assign({},src[i%src.length]))};
  if(S.mood==="sweet"){add(POOL.sweet,20);add(POOL.desire,8);add(POOL.rest,6);add(POOL.special,6)}
  else if(S.mood==="desire"){add(POOL.desire,16);add(POOL.sweet,8);add(POOL.wild,8);add(POOL.rest,6);add(POOL.special,6)}
  else if(S.mood==="wild"){add(POOL.wild,14);add(POOL.desire,12);add(POOL.sweet,6);add(POOL.rest,6);add(POOL.special,6)}
  else{add(POOL.sweet,12);add(POOL.desire,12);add(POOL.wild,8);add(POOL.rest,6);add(POOL.special,6)}
  if(!S.noDrink) add(POOL.drink,8); else {add(POOL.sweet,6);add(POOL.rest,4)}
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
  arr=arr.slice(0,S.n);
  if(!arr.some(t=>t.type==="fly")) arr[Math.floor(S.n*0.3)].type="fly";
  if(!arr.some(t=>t.type==="rest")) arr[Math.floor(S.n*0.55)].type="rest";
  S.tasks=arr;
}

function init(){
  [0,1].forEach(pid=>{
    const box=$("#c"+pid);box.innerHTML="";
    COLORS.forEach(col=>{
      const d=document.createElement("div");
      d.className="cd"+(S.players[pid].color===col?" active":"");
      d.style.background=col;
      d.onclick=()=>{S.players[pid].color=col;$("#av"+pid).style.background=col;init()};
      box.appendChild(d);
    });
    $("#av"+pid).style.background=S.players[pid].color;
    $("#av"+pid).textContent=S.players[pid].name[0];
  });
  $("#btnRules").onclick=()=>show("setup");
  $("#n0").oninput=e=>{S.players[0].name=e.target.value.trim()||"小锐";$("#av0").textContent=S.players[0].name[0]};
  $("#n1").oninput=e=>{S.players[1].name=e.target.value.trim()||"小可爱";$("#av1").textContent=S.players[1].name[0]};
  $$("#pNum button").forEach(b=>b.onclick=()=>{$$("#pNum button").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.pieceCount=+b.dataset.v});
  $$("#gNum button").forEach(b=>b.onclick=()=>{$$("#gNum button").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.n=+b.dataset.v});
  $$("#mood button").forEach(b=>b.onclick=()=>{$$("#mood button").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.mood=b.dataset.v});
  $$("#nd button").forEach(b=>b.onclick=()=>{$$("#nd button").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.noDrink=b.dataset.v==="1"});
  $("#btnStart").onclick=start;
  $("#dbtn").onclick=roll;
  $("#btnSet").onclick=()=>modal("设置","",[{t:"重新开始",p:1,f:()=>start()},{t:"返回设置",f:()=>show("setup")},{t:"关闭",f:()=>{}}]);
}

function start(){
  S.players[0].name=$("#n0").value.trim()||"小锐";
  S.players[1].name=$("#n1").value.trim()||"小可爱";
  S.cur=0;S.over=false;S.lastRoll=0;
  S.players.forEach((p,pid)=>{
    p.pieces=[];
    p.skipTurn=false;
    p.skills=[];
    p.stats={steps:0};
    for(let i=0;i<S.pieceCount;i++) p.pieces.push({id:i,pos:-1}); // -1=基地
  });
  makePool();
  buildBoard();
  updateUI();
  show("game");
  toast(S.players[0].name+" 先手，摇到6出发");
}

function buildBoard(){
  const b=$("#board");
  $$(".cell,.piece").forEach(e=>e.remove());
  for(let i=0;i<S.n;i++){
    const a=(i/S.n)*Math.PI*2-Math.PI/2;
    const x=50+41*Math.cos(a),y=50+41*Math.sin(a);
    const c=document.createElement("div");
    c.className="cell";c.style.left=x+"%";c.style.top=y+"%";
    const t=S.tasks[i];
    if(t&&t.type==="fly"){c.classList.add("fly");c.textContent="✈️"}
    else if(t&&t.type==="rest"){c.classList.add("rest");c.textContent="😴"}
    else c.textContent=i+1;
    b.appendChild(c);
  }
  // 绘制所有棋子
  S.players.forEach((p,pid)=>{
    p.pieces.forEach((pc,idx)=>{
      const el=document.createElement("div");
      el.className="piece";el.id=`pc${pid}_${idx}`;
      el.style.background=p.color;
      el.textContent=(idx+1);
      el.style.left=(pid===0?18:82)+"%";
      el.style.top=(40+idx*12)+"%";
      b.appendChild(el);
    });
  });
  updatePieces();
}

function updatePieces(){
  S.players.forEach((p,pid)=>{
    p.pieces.forEach((pc,idx)=>{
      const el=$(`#pc${pid}_${idx}`);
      if(!el)return;
      if(pc.pos<0){ // 基地
        el.style.left=(pid===0?18:82)+"%";
        el.style.top=(38+idx*14)+"%";
      }else if(pc.pos>=S.n){ // 终点
        el.style.left="50%";
        el.style.top=(42+idx*8)+"%";
      }else{
        const a=(pc.pos/S.n)*Math.PI*2-Math.PI/2;
        // 稍微错开一点，避免完全重叠
        const offset=(idx- (S.pieceCount-1)/2)*3;
        el.style.left=(50+41*Math.cos(a)+offset)+"%";
        el.style.top=(50+41*Math.sin(a)+offset)+"%";
      }
    });
  });
}

function updateUI(){
  const p=S.players[S.cur];
  $("#td").style.background=p.color;
  $("#tt").textContent=p.name+(p.skipTurn?" (将被跳过)":"")+" 的回合";
  // 技能
  const bar=$("#sbar");bar.innerHTML="";
  p.skills.forEach((id,i)=>{
    const sk=SKILLS.find(s=>s.id===id);
    if(!sk)return;
    const el=document.createElement("div");
    el.className="sc";el.textContent=sk.name;
    el.onclick=()=>useSkill(id,i);
    bar.appendChild(el);
  });
}

let rolling=false;
function roll(){
  if(rolling||S.over)return;
  const p=S.players[S.cur];
  if(p.skipTurn){
    p.skipTurn=false;
    toast(p.name+" 被跳过");
    nextTurn();
    return;
  }
  rolling=true;$("#dbtn").disabled=true;
  const d=$("#dice");d.classList.add("rolling");
  let c=0;
  const iv=setInterval(()=>{
    d.textContent=1+Math.floor(Math.random()*6);
    if(++c>10){
      clearInterval(iv);d.classList.remove("rolling");
      const r=1+Math.floor(Math.random()*6);
      d.textContent=r;S.lastRoll=r;
      setTimeout(()=>{handleRoll(r);rolling=false;$("#dbtn").disabled=false},250);
    }
  },60);
}

function handleRoll(num){
  const p=S.players[S.cur];
  // 找出可以移动的棋子
  const movable=[];
  p.pieces.forEach((pc,idx)=>{
    if(pc.pos<0){ // 基地，需要6
      if(num===6) movable.push(idx);
    }else if(pc.pos<S.n){ // 已在棋盘上
      movable.push(idx);
    }
  });

  if(movable.length===0){
    toast("没有可移动的棋子");
    nextTurn();
    return;
  }

  if(movable.length===1){
    movePiece(S.cur,movable[0],num);
  }else{
    // 弹出选择
    const btns=movable.map(idx=>({
      t:`棋子${idx+1}（位置${p.pieces[idx].pos<0?"基地":p.pieces[idx].pos+1}）`,
      p:1,
      f:()=>movePiece(S.cur,idx,num)
    }));
    modal("选择要移动的棋子","",btns);
  }
}

function movePiece(pid,idx,steps){
  const p=S.players[pid];
  const pc=p.pieces[idx];
  let from=pc.pos;

  if(from<0){ // 从基地出发
    // 不同玩家起点不同：玩家0从0，玩家1从 n/2
    pc.pos = (pid===0 ? 0 : Math.floor(S.n/2));
    toast(p.name+" 的棋子"+(idx+1)+" 出发");
  }else{
    let target=from+steps;
    if(target>S.n){ // 超过终点，回退
      const over=target-S.n;
      target=S.n-over;
      if(target<0) target=0;
      toast("超过终点，回退到第"+(target+1)+"格");
    }
    if(target===S.n){
      pc.pos=S.n;
      toast("棋子"+(idx+1)+" 到达终点！");
    }else{
      pc.pos=target;
    }
  }
  p.stats.steps+=steps;
  updatePieces();

  // 检查是否全部到达
  if(p.pieces.every(x=>x.pos>=S.n)){
    setTimeout(()=>endGame(pid),500);
    return;
  }

  // 落地任务（只对还在棋盘上的）
  if(pc.pos>=0 && pc.pos<S.n){
    setTimeout(()=>onLand(pid,pc.pos),400);
  }else{
    nextTurn();
  }
}

function onLand(pid,pos){
  const task=S.tasks[pos];
  if(!task){nextTurn();return}
  if(task.type==="rest"){
    S.players[pid].skipTurn=true;
    modal("休息","下一回合你将被跳过",[{t:"知道了",p:1,f:nextTurn}]);
    return;
  }
  modal("任务",task.text+[task.time?`（${task.time}秒）`:""],[
    {t:"完成",p:1,f:()=>{
      if(task.type==="fly"){
        // 简单飞跃
        const p=S.players[pid];
        // 找一个还在路上的棋子飞跃
        const onBoard=p.pieces.find(x=>x.pos>=0&&x.pos<S.n);
        if(onBoard){onBoard.pos=Math.min(S.n,onBoard.pos+4);updatePieces()}
      }
      nextTurn();
    }},
    {t:"跳过",f:nextTurn}
  ]);
}

function nextTurn(){
  S.cur=1-S.cur;
  updateUI();
  const p=S.players[S.cur];
  if(p.skipTurn){
    // 会在roll时处理
  }
  toast(p.name+" 的回合");
}

function endGame(wid){
  S.over=true;
  modal("游戏结束",S.players[wid].name+" 的所有棋子都到达终点！",[
    {t:"再来一局",p:1,f:()=>start()},
    {t:"返回设置",f:()=>show("setup")}
  ]);
}

function useSkill(id,idx){
  // 简化
  S.players[S.cur].skills.splice(idx,1);
  updateUI();
  toast("技能已使用（简化效果）");
}

function modal(title,body,acts){
  const root=$("#mroot");
  root.innerHTML=`<div class="mo"><div class="modal"><div class="mt">${title}</div><div class="mb">${body||""}</div><div class="ma">${acts.map(a=>`<button class="btn ${a.p?"btn-p":"btn-s"}">${a.t}</button>`).join("")}</div></div></div>`;
  root.querySelectorAll(".btn").forEach((b,i)=>{
    b.onclick=()=>{root.innerHTML="";if(acts[i].f)acts[i].f()};
  });
}

document.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
